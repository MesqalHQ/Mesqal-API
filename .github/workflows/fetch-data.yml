name: Fetch Financial Data

on:
  workflow_dispatch:  # Triggered by cron-job.org
  push:
    branches: ["main"]  # Also run on push for testing

permissions:
  contents: write

jobs:
  fetch-and-save:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch and append data
        run: |
          set -e
          
          # Tehran time (UTC+3:30)
          DATE=$(date -u -d "+3 hours 30 minutes" +"%Y-%m-%d")
          TIME=$(date -u -d "+3 hours 30 minutes" +"%H:%M:%S")
          
          mkdir -p data
          FILE="data/${DATE}.json"
          
          # Create secure temp files in system /tmp (outside the git repo)
          FIN_TMP=$(mktemp)
          PAMP_TMP=$(mktemp)
          MERGE_TMP=$(mktemp)
          
          # Automatically delete temp files when script exits
          trap 'rm -f "$FIN_TMP" "$PAMP_TMP" "$MERGE_TMP"' EXIT
          
          # ==========================================
          # 1. FETCH FINANCIAL DATA (From Mesqal-Crawler GitHub Pages)
          # ==========================================
          # ⚠️ Update this URL if your repo name or org name is different
          FIN_API="https://mesqalhq.github.io/Mesqal-Crawler/api/currencies.json"
          echo "📡 Fetching financial data from GitHub Pages..."
          
          # Capture HTTP status code
          HTTP_CODE=$(curl -s -o "$FIN_TMP" -w "%{http_code}" -L --max-time 15 "$FIN_API" || echo "000")
          
          echo "Financial API HTTP Code: $HTTP_CODE"
          
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Financial API failed! Response:"
            head -c 300 "$FIN_TMP"
            echo "null" > "$FIN_TMP" # Fallback to null so the script doesn't crash
          elif [ ! -s "$FIN_TMP" ]; then
            echo "❌ Financial API returned an empty body."
            echo "null" > "$FIN_TMP"
          elif ! jq empty "$FIN_TMP" 2>/dev/null; then
            echo "❌ Invalid financial API JSON."
            echo "null" > "$FIN_TMP"
          fi
          
          # ==========================================
          # 2. FETCH PAMP DATA
          # ==========================================
          PAMP_API="https://amirmasoud.netlify.app/api/v1/pamp"
          echo "📡 Fetching PAMP data..."
          curl -s --max-time 15 "$PAMP_API" > "$PAMP_TMP" || true
          
          if [ ! -s "$PAMP_TMP" ] || ! jq empty "$PAMP_TMP" 2>/dev/null; then
            echo "❌ Invalid PAMP API response"
            exit 1
          fi
          
          # ==========================================
          # 3. MERGE AND SAVE
          # ==========================================
          if [ ! -f "$FILE" ]; then
            echo "[]" > "$FILE"
          fi
          
          # Append snapshot using --slurpfile
          jq --arg time "$TIME" \
             --slurpfile financial "$FIN_TMP" \
             --slurpfile pamp "$PAMP_TMP" \
             '. += [{"time": $time, "financial": $financial[0], "pamp": $pamp[0]}]' \
             "$FILE" > "$MERGE_TMP"
          
          if ! jq empty "$MERGE_TMP" 2>/dev/null; then
            echo "❌ jq failed to merge data correctly."
            exit 1
          fi
          
          mv "$MERGE_TMP" "$FILE"
          echo "✅ Saved snapshot for $DATE $TIME to $FILE"

      - name: Generate dates.json
        run: |
          cd data
          ls -1 *.json 2>/dev/null | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}\.json$' | sed 's/\.json$//' | sort -r > dates.txt
          jq -R -s 'split("\n") | map(select(length > 0))' dates.txt > dates.json
          rm dates.txt
          echo "✅ Generated dates.json"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add data/
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Data snapshot $(date -u -d '+3 hours 30 minutes' +'%Y-%m-%d %H:%M')"
            git push
          fi
