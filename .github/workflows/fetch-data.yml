name: Fetch Financial Data

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  fetch-and-save:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch and append data
        run: |
          set -euo pipefail
          
          export TZ='Asia/Tehran'
          DATE=$(date +"%Y-%m-%d")
          TIME=$(date +"%H:%M:%S")
          
          mkdir -p data
          FILE="data/${DATE}.json"
          
          # --- Helper: fetch with verbose failure info ---
          fetch_json() {
            local url="$1"
            local label="$2"
            local response
            
            echo "📡 Fetching $label..."
            
            # First attempt: get HTTP metadata without -f so we can inspect
            local http_code
            http_code=$(curl -sL -o /tmp/response_body.txt -w "%{http_code}" \
              --retry 3 --retry-delay 5 --max-time 30 "$url") || {
                echo "❌ $label: curl failed (network/DNS/timeout)"
                cat /tmp/response_body.txt 2>/dev/null | head -c 500 || true
                return 1
              }
            
            if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
              echo "❌ $label: HTTP $http_code"
              head -c 500 /tmp/response_body.txt || true
              echo ""
              return 1
            fi
            
            response=$(cat /tmp/response_body.txt)
            
            if ! printf '%s' "$response" | jq empty 2>/dev/null; then
              echo "❌ $label: Invalid JSON (HTTP $http_code)"
              printf '%s' "$response" | head -c 500
              echo ""
              return 1
            fi
            
            printf '%s' "$response"
          }
          
          # Fetch both APIs
          FIN_RESPONSE=$(fetch_json "https://api.dastyar.io/express/financial-item" "Financial API") || exit 1
          echo "✅ Financial data validated"
          
          PAMP_RESPONSE=$(fetch_json "https://amirmasoud.netlify.app/api/v1/pamp" "PAMP API") || exit 1
          echo "✅ PAMP data validated"
          
          # Initialize and append
          [ -f "$FILE" ] || echo "[]" > "$FILE"
          
          jq --arg time "$TIME" \
             --argjson financial "$FIN_RESPONSE" \
             --argjson pamp "$PAMP_RESPONSE" \
             '. += [{"time": $time, "financial": $financial, "pamp": $pamp}]' \
             "$FILE" > tmp.json && mv tmp.json "$FILE"
          
          echo "✅ Saved snapshot for $DATE $TIME"
    
      - name: Generate dates.json
        run: |
          set -euo pipefail
          cd data
          
          # Extract date filenames, sort descending, build JSON array
          ls -1 *.json 2>/dev/null \
            | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}\.json$' \
            | sed 's/\.json$//' \
            | sort -r \
            | jq -R -s 'split("\n") | map(select(length > 0))' \
            > dates.json.tmp && mv dates.json.tmp dates.json
          
          echo "✅ Generated dates.json"

      - name: Commit and push
        run: |
          set -euo pipefail
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add data/
          
          if git diff --staged --quiet; then
            echo "ℹ️ No changes to commit"
          else
            export TZ='Asia/Tehran'
            COMMIT_MSG="Data snapshot $(date +'%Y-%m-%d %H:%M')"
            git commit -m "$COMMIT_MSG"
            git push
            echo "✅ Committed and pushed: $COMMIT_MSG"
          fi
