name: Fetch Financial Data

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  fetch-and-save:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch and append data
        run: |
          set -euo pipefail
          
          # Tehran time using proper timezone (handles DST correctly)
          export TZ='Asia/Tehran'
          DATE=$(date +"%Y-%m-%d")
          TIME=$(date +"%H:%M:%S")
          
          mkdir -p data
          FILE="data/${DATE}.json"
          
          # --- Fetch Financial Data with retry & fail-on-error ---
          FIN_API="https://api.dastyar.io/express/financial-item"
          echo "📡 Fetching financial data..."
          FIN_RESPONSE=$(curl -sfL --retry 3 --retry-delay 5 --max-time 30 "$FIN_API") || {
            echo "❌ Failed to fetch financial API after retries"
            exit 1
          }
          
          # Safe JSON validation (no broken pipe)
          if ! printf '%s' "$FIN_RESPONSE" | jq empty 2>/dev/null; then
            echo "❌ Invalid financial API JSON response:"
            printf '%s' "$FIN_RESPONSE" | head -c 500
            echo ""
            exit 1
          fi
          echo "✅ Financial data validated"
          
          # --- Fetch PAMP Data with retry & fail-on-error ---
          PAMP_API="https://amirmasoud.netlify.app/api/v1/pamp"
          echo "📡 Fetching PAMP data..."
          PAMP_RESPONSE=$(curl -sfL --retry 3 --retry-delay 5 --max-time 30 "$PAMP_API") || {
            echo "❌ Failed to fetch PAMP API after retries"
            exit 1
          }
          
          if ! printf '%s' "$PAMP_RESPONSE" | jq empty 2>/dev/null; then
            echo "❌ Invalid PAMP API JSON response:"
            printf '%s' "$PAMP_RESPONSE" | head -c 500
            echo ""
            exit 1
          fi
          echo "✅ PAMP data validated"
          
          # Initialize file if missing
          [ -f "$FILE" ] || echo "[]" > "$FILE"
          
          # Atomic append (write to temp then move)
          jq --arg time "$TIME" \
             --argjson financial "$FIN_RESPONSE" \
             --argjson pamp "$PAMP_RESPONSE" \
             '. += [{"time": $time, "financial": $financial, "pamp": $pamp}]' \
             "$FILE" > tmp.json && mv tmp.json "$FILE"
          
          echo "✅ Saved snapshot for $DATE $TIME"

      - name: Generate dates.json
        run: |
          set -euo pipefail
          cd data
          
          # Extract date filenames, sort descending, build JSON array
          ls -1 *.json 2>/dev/null \
            | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}\.json$' \
            | sed 's/\.json$//' \
            | sort -r \
            | jq -R -s 'split("\n") | map(select(length > 0))' \
            > dates.json.tmp && mv dates.json.tmp dates.json
          
          echo "✅ Generated dates.json"

      - name: Commit and push
        run: |
          set -euo pipefail
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add data/
          
          if git diff --staged --quiet; then
            echo "ℹ️ No changes to commit"
          else
            export TZ='Asia/Tehran'
            COMMIT_MSG="Data snapshot $(date +'%Y-%m-%d %H:%M')"
            git commit -m "$COMMIT_MSG"
            git push
            echo "✅ Committed and pushed: $COMMIT_MSG"
          fi
