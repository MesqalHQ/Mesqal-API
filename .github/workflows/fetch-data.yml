name: Fetch Financial Data

on:
  workflow_dispatch:  # Triggered by cron-job.org
  push:
    branches: ["main"]  # Also run on push for testing

permissions:
  contents: write

jobs:
  fetch-and-save:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch and append data
        run: |
          set -e
          
          # Tehran time (UTC+3:30)
          DATE=$(date -u -d "+3 hours 30 minutes" +"%Y-%m-%d")
          TIME=$(date -u -d "+3 hours 30 minutes" +"%H:%M:%S")
          
          mkdir -p data
          FILE="data/${DATE}.json"
          
          # Fetch financial data
          FIN_API="https://api.dastyar.io/express/financial-item"
          FIN_RESPONSE=$(curl -s --max-time 15 "$FIN_API" || true)
          
          # Use printf to safely handle any leading dashes or special chars
          printf "%s" "$FIN_RESPONSE" > fin_tmp.json
          if ! jq empty fin_tmp.json 2>/dev/null; then
            echo "❌ Invalid financial API response"
            cat fin_tmp.json | head -c 200
            exit 1
          fi
          
          # Fetch PAMP data
          PAMP_API="https://amirmasoud.netlify.app/api/v1/pamp"
          PAMP_RESPONSE=$(curl -s --max-time 15 "$PAMP_API" || true)
          
          printf "%s" "$PAMP_RESPONSE" > pamp_tmp.json
          if ! jq empty pamp_tmp.json 2>/dev/null; then
            echo "❌ Invalid PAMP API response"
            cat pamp_tmp.json | head -c 200
            exit 1
          fi
          
          # Create file if it doesn't exist
          if [ ! -f "$FILE" ]; then
            echo "[]" > "$FILE"
          fi
          
          # Append snapshot using --slurpfile (avoids bash argument limits/escaping issues)
          # Note: --slurpfile wraps the content in an array, so we use $financial[0] and $pamp[0]
          jq --arg time "$TIME" \
             --slurpfile financial fin_tmp.json \
             --slurpfile pamp pamp_tmp.json \
             '. += [{"time": $time, "financial": $financial[0], "pamp": $pamp[0]}]' \
             "$FILE" > tmp.json
          
          # Validate jq output before overwriting
          if ! jq empty tmp.json 2>/dev/null; then
            echo "❌ jq failed to merge data correctly."
            exit 1
          fi
          
          mv tmp.json "$FILE"
          
          # Clean up temp files so they aren't committed
          rm -f fin_tmp.json pamp_tmp.json
          
          echo "✅ Saved snapshot for $DATE $TIME"

      - name: Generate dates.json
        run: |
          cd data
          # List all .json files (except dates.json), extract dates, sort descending
          ls -1 *.json 2>/dev/null | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}\.json$' | sed 's/\.json$//' | sort -r > dates.txt
          jq -R -s 'split("\n") | map(select(length > 0))' dates.txt > dates.json
          rm dates.txt
          echo "✅ Generated dates.json"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add data/
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Data snapshot $(date -u -d '+3 hours 30 minutes' +'%Y-%m-%d %H:%M')"
            git push
          fi
